# Option B: the whole app in Docker on one EC2 instance, using the managed AWS services
# (RDS PostgreSQL, MongoDB Atlas, S3, SES) instead of local database and MinIO containers.
# Run through infra/aws/docker/setup_ec2_docker.sh, which also installs Docker. By hand:
#
#   sudo docker compose -f infra/aws/docker/docker-compose.yml up --build -d
#   sudo COMPOSE_PROFILES=edge,demo-data docker compose -f infra/aws/docker/docker-compose.yml up --build -d
#
# Addresses: UI at http://<elastic-ip>/ (nginx also forwards /api/ to the API) and the API itself at
# http://<elastic-ip>:8000 for edge clients such as CARLA. Settings come from backend/.env
# (template: infra/aws/backend.env.production.example). AWS credentials come from the instance's
# IAM role; containers reach it only when the instance metadata hop limit is 2 (the Amazon Linux
# 2023 default).
name: autosound

x-backend: &backend
  image: autosound-backend:aws
  build:
    context: ../../..
    dockerfile: backend/Dockerfile
    args:
      INSTALL_BACKUP_TOOLS: "true"
  restart: unless-stopped

services:
  api:
    <<: *backend
    env_file: ../../../backend/.env
    environment:
      MODEL_DIR: /app/model/artifacts
      SKIP_SEED: ${SKIP_SEED:-0}
    # Migrate, seed the demo data unless SKIP_SEED=1 (idempotent), then serve with ONE worker:
    # the C3 processing worker, C2 device sweeper and backup jobs run inside this process.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        if [ "$$SKIP_SEED" != "1" ]; then python -m app.db.seed; fi &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "8000:8000"
    volumes:
      - backups:/app/backend/.local_backups

  frontend:
    image: autosound-frontend:aws
    build:
      context: ../../..
      dockerfile: frontend/Dockerfile
    ports:
      - "80:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional (profile "edge"): local edge client, keeps the C2 Simulator live without CARLA.
  # Stop it before a CARLA client connects with the same devices:
  #   sudo docker compose -f infra/aws/docker/docker-compose.yml stop edge-demo
  edge-demo:
    <<: *backend
    profiles: [edge]
    env_file: ../edge.env
    environment:
      EDGE_API_URL: http://api:8000
    command: [python, -m, edge.demo_client, --no-audio-playback, --buffer-dir, /app/backend/.local_edge/demo]
    volumes:
      - edge-buffer:/app/backend/.local_edge/demo
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  # Optional (profile "demo-data"): scripts/demo_data.py --live, moving cars on C1 Map/Tracking.
  demo-data:
    <<: *backend
    profiles: [demo-data]
    env_file:
      - ../../../backend/.env
      - ../edge.env
    volumes:
      - ../../../scripts:/app/scripts:ro
    command: [sh, -c, 'exec python /app/scripts/demo_data.py $$DEMO_DATA_ARGS']
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

volumes:
  backups:
  edge-buffer:
