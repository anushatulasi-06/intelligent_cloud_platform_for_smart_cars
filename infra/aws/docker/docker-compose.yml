# Option B: the whole app in Docker on one EC2 instance, using the managed AWS services
# (RDS PostgreSQL, MongoDB Atlas, S3, SES) instead of local database and MinIO containers.
# Run only through setup_ec2_docker.sh after deployment and cost authorization.
# Do not bypass preflight with direct build/up. The variables below are not a spending cap.
# UI binds 127.0.0.1:80 and API 127.0.0.1:8000; access both through an SSH tunnel only.
# Settings come from backend/.env
# (template: infra/aws/backend.env.production.example). AWS credentials come from the instance's
# IAM role; explicitly configure the instance metadata hop limit as 2 for this container path.
name: autosound
x-deployment-acknowledgement: ${ALLOW_AWS_DEPLOYMENT:?Use the guarded setup script with explicit deployment authorization}
x-cost-acknowledgement: ${AWS_COST_ACK:?Explicit AWS usage-cost acknowledgement is required}
x-credit-budget: ${AWS_CREDIT_BUDGET_USD:?A positive authorized credit budget is required by the setup guard}

x-backend: &backend
  image: autosound-backend:aws
  build:
    context: ../../..
    dockerfile: backend/Dockerfile
    args:
      INSTALL_BACKUP_TOOLS: "true"
  restart: unless-stopped

services:
  api:
    <<: *backend
    env_file: ../../../backend/.env
    environment:
      MODEL_DIR: /app/model/artifacts
      APP_ENV: production
    # No development seed runs in production. Bootstrap private accounts separately.
    # Use ONE worker:
    # the C3 processing worker, C2 device sweeper and backup jobs run inside this process.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backups:/app/backend/.local_backups
      - private-bootstrap:/app/backend/.local_bootstrap

  frontend:
    image: autosound-frontend:aws
    build:
      context: ../../..
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:80:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional (profile "edge"): an edge client for car 1, keeps the C2 Simulator live without a
  # CARLA server. EDGE_CLIENT in infra/aws/edge.env: replay_client (default) or demo_client.
  # Stop it before a CARLA client connects with the same devices:
  #   bash infra/aws/docker/compose.sh stop edge-demo
  edge-demo:
    <<: *backend
    profiles: [edge]
    env_file: ../edge.env
    environment:
      EDGE_API_URL: http://api:8000
    command: [sh, -c, 'exec python -m "edge.$${EDGE_CLIENT:-replay_client}" --no-audio-playback --buffer-dir /app/backend/.local_edge/demo']
    volumes:
      - edge-buffer:/app/backend/.local_edge/demo
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  # Optional (profile "demo-data"): scripts/demo_data.py --live, moving cars on C1 Map/Tracking.
  demo-data:
    <<: *backend
    profiles: [demo-data]
    env_file:
      - ../../../backend/.env
      - ../edge.env
    volumes:
      - ../../../scripts:/app/scripts:ro
    command: [sh, -c, 'exec python /app/scripts/demo_data.py $$DEMO_DATA_ARGS']
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

volumes:
  backups:
  edge-buffer:
  private-bootstrap:
